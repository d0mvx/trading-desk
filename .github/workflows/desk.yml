# Paper-trading desk, 24/7 on GitHub Actions. PAPER ONLY (Alpaca paper endpoint hard-wired, meme sleeve = simulated fills).
# One long job (~5h50m) runs gh/crontab.gh (= the box's #DESK cron lines) via gh/desk_loop.py, commits state to branch
# `state` every 5 min, dispatches its successor ~12 min before the end and saves state on stop/timeout.
# Safety switch: nothing trades unless the file GH_LIVE exists on branch `state` (written by box/cutover.sh after the box's
# cron lines are off, removed by box/rollback.sh) -> the box and GitHub never trade or publish at the same time.
name: desk-live

on:
  schedule:
    - cron: "3 */6 * * *"        # safety net every 6 h (the normal chain is the self-dispatch handover)
  workflow_dispatch:
    inputs:
      max_minutes:
        description: "loop length in minutes from job start (default 350 = 5h50m)"
        required: false
        default: "350"

concurrency:
  group: desk-live               # never two runs at once: a new run waits (pending) until the old one has saved state
  cancel-in-progress: false

permissions:
  contents: write                # push to branch `state`
  actions: write                 # self-dispatch of the next run (workflow_dispatch via GITHUB_TOKEN is allowed)

jobs:
  desk:
    runs-on: ubuntu-24.04
    timeout-minutes: 359
    env:
      TZ: Europe/Berlin
      PYTHONUNBUFFERED: "1"
      ALPACA_PAPER: "1"
    steps:
      - name: Record job start
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Checkout code (main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: desk
          fetch-depth: 1

      - name: Checkout state (branch state)
        uses: actions/checkout@v4
        with:
          ref: state
          path: state
          fetch-depth: 50

      - name: Live gate (state/GH_LIVE)
        id: gate
        run: |
          if [ -f state/GH_LIVE ]; then echo "live=true" >> "$GITHUB_OUTPUT"; else echo "live=false" >> "$GITHUB_OUTPUT"; echo "::notice::state/GH_LIVE missing -> desk not live on GitHub (box mode), nothing runs"; fi

      - name: Python 3.13.5 (pinned)
        if: steps.gate.outputs.live == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.5"
          cache: pip
          cache-dependency-path: desk/requirements*.txt

      - name: Desk layout (~/.desk -> checkout), venv, state import
        if: steps.gate.outputs.live == 'true'
        run: |
          set -euo pipefail
          ln -sfn "$GITHUB_WORKSPACE/desk" "$HOME/.desk"
          python -m venv "$HOME/.desk/venv"
          "$HOME/.desk/venv/bin/pip" install -q --disable-pip-version-check -r "$HOME/.desk/requirements-dev.txt"
          git -C state config user.name  "desk-bot"
          git -C state config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          "$HOME/.desk/venv/bin/python" desk/gh/state_sync.py import state "$HOME/.desk"
          mkdir -p "$HOME/.desk/logs" "$HOME/.desk/dial" "$HOME/.desk/scan"
          chmod +x "$HOME"/.desk/*.sh "$HOME"/.desk/*.py
          # no secret FILES on the runner: scripts read ALPACA_KEY/ALPACA_SECRET/SEC_USER_AGENT/HERENOW_* from env
          for f in alpaca.env sec.env dash_token herenow_site.json; do test ! -e "$HOME/.desk/$f"; done

      - name: Verify GITHUB_TOKEN write access (contents -> state commits, actions -> self-dispatch)
        if: steps.gate.outputs.live == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git -C state push --dry-run origin HEAD:state && echo "contents:write ok"
          # idempotent no-op that requires actions:write (workflow is already enabled)
          if gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/desk.yml/enable" >/dev/null; then echo "actions:write ok"
          else echo "::error::actions:write missing -> handover self-dispatch will fail; only the 6-h schedule restarts the desk"; fi

      - name: Tests (risk rules) must pass before trading
        if: steps.gate.outputs.live == 'true'
        working-directory: desk
        run: |
          "$HOME/.desk/venv/bin/python" -m pytest tests --ignore=tests/backtest -q -p no:cacheprovider

      - name: Desk loop (~5h50m)
        if: steps.gate.outputs.live == 'true'
        timeout-minutes: 354
        env:
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          HERENOW_API_KEY: ${{ secrets.HERENOW_API_KEY }}
          HERENOW_SITE_SLUG: ${{ secrets.HERENOW_SITE_SLUG }}
          HERENOW_SITE_PASSWORD: ${{ secrets.HERENOW_SITE_PASSWORD }}
          HERENOW_WIDGET_SLUG: ${{ secrets.HERENOW_WIDGET_SLUG }}
          HERENOW_WIDGET_PATH: ${{ secrets.HERENOW_WIDGET_PATH }}
          HERENOW_REQUIRE_SLUG: "1"          # never create a new here.now site from a runner
          DASH_TOKEN: ${{ secrets.DASH_TOKEN }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          MAX="${{ github.event.inputs.max_minutes || '350' }}"
          END=$(( JOB_START + MAX * 60 ))
          EXCL=()
          if [ -z "${HERENOW_API_KEY}" ] || [ -z "${HERENOW_SITE_SLUG}" ]; then EXCL+=(--exclude herenow_publish); echo "::warning::here.now secrets missing -> publish disabled"; fi
          # exec: the loop itself receives SIGINT/SIGTERM on cancel/step timeout and saves state gracefully
          exec "$HOME/.desk/venv/bin/python" desk/gh/desk_loop.py \
            --end-epoch "$END" --state-worktree "$GITHUB_WORKSPACE/state" --push \
            --commit-every 5 --commit-offset 3 --grace 150 "${EXCL[@]}" \
            --handover-before 12 --handover-cmd "gh workflow run desk.yml --repo '$GITHUB_REPOSITORY' --ref main"

      - name: Save state (always, also on cancel/timeout)
        if: always() && steps.gate.outputs.live == 'true'
        timeout-minutes: 4
        run: |
          [ -d "$HOME/.desk" ] || exit 0
          PY="$HOME/.desk/venv/bin/python"; [ -x "$PY" ] || PY=python3
          "$PY" desk/gh/state_sync.py export "$HOME/.desk" state || true
          "$PY" desk/gh/state_sync.py commit state -m "state $(date '+%Y-%m-%d %H:%M %Z') (job end: ${{ job.status }})" --push --retries 6

      - name: Re-dispatch if the loop died early (chain keeper)
        if: failure() && steps.gate.outputs.live == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # only after a crash well before the planned end; avoids hot-looping on a persistent error (min 10 min runtime)
          if [ $(( $(date +%s) - JOB_START )) -gt 600 ]; then gh workflow run desk.yml --repo "$GITHUB_REPOSITORY" --ref main; fi
